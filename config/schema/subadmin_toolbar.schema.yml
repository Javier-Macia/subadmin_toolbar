subadmin_toolbar.settings:
  type: config_object
  label: 'Subadmin Toolbar settings'
  mapping:
    links:
      type: sequence
      label: 'Links'
      sequence:
        type: mapping
        label: 'Link item'
        mapping:
          id:
            type: string
            label: 'ID'
          pid:
            type: string
            label: 'Parent ID'
          title:
            type: string
            label: 'Title'
          url:
            type: string
            label: 'URL'
          icon_type:
            type: string
            label: 'Icon Font Family'
          icon:
            type: string
            label: 'Icon'
          roles:
            type: sequence
            label: 'Roles'
            sequence:
              type: string
              label: 'Role name'
          status:
            type: string
            label: 'Status (enabled/disabled)'
          weight:
            type: integer
            label: 'Weight'
    widgets:
      type: sequence
      label: 'Widgets'
      sequence:
        type: mapping
        label: 'Widget item'
        mapping:
          id:
            type: string
            label: 'ID'
          plugin_id:
            type: string
            label: 'Block Plugin ID'
          label:
            type: string
            label: 'Custom Label'
          label_display:
            type: boolean
            label: 'Display Label'
          status:
            type: string
            label: 'Status (enabled/disabled)'
          roles:
            type: sequence
            label: 'Roles'
            sequence:
              type: string
              label: 'Role name'
          weight:
            type: integer
            label: 'Weight'
          settings:
            type: ignore
            label: 'Block Plugin Settings'

subadmin_toolbar.general:
  type: config_object
  label: 'Subadmin Toolbar General Settings'
  mapping:
    toolbar_title:
      type: string
      label: 'Toolbar Title'
    accent_color:
      type: string
      label: 'Accent Color'
    toolbar_icon:
      type: integer
      label: 'Toolbar Icon File ID'
      nullable: true
    toolbar_title_link:
      type: string
      label: 'Toolbar Title Link'
    hide_icon:
      type: boolean
      label: 'Hide Toolbar Icon'
    enable_font_awesome:
      type: boolean
      label: 'Enable Font Awesome'
    appearance:
      type: mapping
      label: 'Appearance'
      mapping:
        height:
          type: integer
          label: 'Toolbar height in pixels'
        item_padding:
          type: integer
          label: 'Horizontal padding of top-level items in pixels'
        submenu_min_width:
          type: integer
          label: 'Minimum submenu width in pixels'
        font_family:
          type: string
          label: 'Font family'
        font_size:
          type: integer
          label: 'Font size in pixels'
        font_weight:
          type: integer
          label: 'Font weight'
        letter_spacing:
          type: string
          label: 'Letter spacing'
        icon_size:
          type: integer
          label: 'Icon size in pixels'
        icon_opacity:
          type: string
          label: 'Icon opacity'
        radius:
          type: string
          label: 'Corner radius of submenus and split buttons'
        shadow:
          type: string
          label: 'Shadow'
        border_bottom:
          type: string
          label: 'Line below the toolbar'
        colors:
          type: mapping
          label: 'Colors'
          mapping:
            light:
              type: subadmin_toolbar.colors
              label: 'Light colors'
            dark:
              type: subadmin_toolbar.colors
              label: 'Dark colors'
        open_delay:
          type: integer
          label: 'Submenu open delay in milliseconds'
        close_delay:
          type: integer
          label: 'Submenu close delay in milliseconds'
        show_submenu_icons:
          type: boolean
          label: 'Show icons inside submenus'
        indicator:
          type: string
          label: 'Parent indicator style'
        position:
          type: string
          label: 'Toolbar position'
        sidebar_mode:
          type: string
          label: 'Sidebar mode'
        sidebar_width:
          type: integer
          label: 'Sidebar width in pixels'
        sidebar_start_collapsed:
          type: boolean
          label: 'Start the sidebar collapsed'

subadmin_toolbar.colors:
  type: mapping
  label: 'Toolbar colors (empty to inherit the stylesheet default)'
  mapping:
    bg:
      type: string
      label: 'Background'
    text:
      type: string
      label: 'Text'
    hover_bg:
      type: string
      label: 'Hover background'
    submenu_bg:
      type: string
      label: 'Submenu background'
    border:
      type: string
      label: 'Border'
